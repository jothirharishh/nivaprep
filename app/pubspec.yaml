name: boardmate10
description: Tamil Nadu Samacheer Kalvi Class 10 board exam preparation app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # HTTP
  http: ^1.2.0
  # Local persistence
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  # State management
  provider: ^6.1.2
  # Connectivity
  connectivity_plus: ^6.0.3
  # Storage
  shared_preferences: ^2.3.2
  # UUID generation (for local student ID)
  uuid: ^4.4.0
  # Intl (dates)
  intl: ^0.19.0
  sqflite_common_ffi_web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
