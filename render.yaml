# =============================================================================
# BoardMate 10 — Render Deployment Blueprint (render.yaml)
# =============================================================================
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: boardmate10-api
    runtime: python
    region: singapore # Closest to India / Tamil Nadu for low latency
    plan: free
    branch: main
    buildCommand: "pip install --upgrade pip && pip install --extra-index-url https://download.pytorch.org/whl/cpu -r backend/requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 'backend.app:create_app()'"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: DATABASE_URL
        sync: false   # Enter your Supabase connection string in Render Dashboard
      - key: GROQ_API_KEY
        sync: false   # Enter your Groq API key in Render Dashboard
      - key: ADMIN_API_KEY
        generateValue: true
      - key: FLASK_SECRET_KEY
        generateValue: true
